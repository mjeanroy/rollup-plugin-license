name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
        with:
          fetch-tags: true
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Set up NodeJS
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        name: Set up PNPM
        with:
          version: 12.23.0
          node-version-file: false
          install: false
          cache: false
      - name: Fetch all tags
        run: |
          git fetch --prune --unshallow --tags
          git tag --list --sort=committerdate
      - name: Checkout tag
        run: git checkout "${VERSION}"
        env:
          VERSION: ${{ inputs.version }}
      - name: pnpm install
        run: pnpm install
      - name: Publish (test)
        run: pnpm publish --dry-run --no-git-checks
      - name: Publish
        if: inputs.dry_run == false
        run: pnpm publish --no-git-checks --provenance
